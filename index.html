<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AIRpipe — Generador de Planos SVG</title>
    <link rel="stylesheet" href="css/main.css">
    <!-- Inline styles extracted to css/main.css -->
</head>

<body>
    <div id="app">
        <!-- Top Ribbon -->
        <header id="ribbon">
            <div class="ribbon-brand">
                <img src="logo_airpipe.png" alt="AIRpipe Logo">
                <p>v3.0.1</p>
                <div id="project-name-display"></div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-tools">
                    <button class="tool-btn" id="btn-line" title="Tubería (L)">
                        <span class="icon-line"></span>
                        Tubería
                    </button>
                    <button class="tool-btn" id="btn-compresor" title="Compresor">
                        <span class="icon icon-compresor"></span>
                        Compresor
                    </button>
                    <button class="tool-btn" id="btn-bajada" title="Bajada / Drop (Punto de Uso)">
                        <span class="icon icon-bajada"></span>
                        Bajada
                    </button>
                    <button class="tool-btn" id="btn-valvula" title="Válvula">
                        <span class="icon icon-valvula"></span>
                        Válvula
                    </button>
                </div>
                <div class="ribbon-group-label">Dibujo</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-tools">
                    <button class="tool-btn active" id="btn-cursor" title="Seleccionar (Esc)">
                        ↖
                        Seleccionar
                    </button>
                    <button class="tool-btn" id="btn-acotar" title="Acotar (D)">
                        📏
                        Acotar
                    </button>
                    <button class="tool-btn" id="btn-desfase" title="Desfase Paralelo">
                        ⫽
                        Paralela
                    </button>
                    <button class="tool-btn" id="btn-nota" title="Nota (N)">
                        📝
                        Nota
                    </button>
                    <button class="tool-btn" id="btn-mover" title="Mover (M)">
                        ✥
                        Mover
                    </button>
                    <button class="tool-btn" id="btn-matriz" title="Matriz / Pattern">
                        ▦
                        Matriz
                    </button>
                    <button class="tool-btn" id="btn-borrar" title="Borrar (Del)">
                        🗑
                        Borrar
                    </button>
                    <button class="tool-btn" id="btn-undo" title="Deshacer (Ctrl+Z)">
                        ↩
                        Deshacer
                    </button>
                </div>
                <div class="ribbon-group-label">Modificar</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-tools">
                    <button class="tool-btn" id="btn-pan" title="Encuadre (Espacio)">
                        <span class="icon icon-pan"></span>
                        Encuadre
                    </button>
                    <button class="tool-btn" id="btn-center" title="Centrar (C)">
                        🎯
                        Centrar
                    </button>
                    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: #bcbcbc;">
                        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                            <input type="checkbox" id="check-isometric"> 📐 3D
                        </label>
                        <div id="z-height-control" style="display: none; align-items: center; gap: 5px;">
                            <label for="input-z">Z:</label>
                            <input type="number" id="input-z" step="0.5" value="0" style="width: 45px; background: #3c3c3c; border: 1px solid #555; color: white; font-size: 10px; border-radius: 3px; padding: 2px;">
                        </div>
                    </div>
                </div>
                <div class="ribbon-group-label">Vista</div>
            </div>

            <div class="ribbon-group">
                <div class="ribbon-tools">
                    <button class="tool-btn" id="btn-new-project" title="Nuevo Proyecto">
                        📄
                        Nuevo
                    </button>
                    <button class="tool-btn" id="btn-save-project" title="Guardar">
                        💾
                        Guardar
                    </button>
                    <button class="tool-btn" id="btn-open-project" title="Abrir">
                        📂
                        Abrir
                    </button>
                    <button class="tool-btn" id="btn-generar" title="Generar Plano" style="color: #4fc3f7;">
                        ⚡
                        Generar
                    </button>
                    <div style="display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: #bcbcbc;">
                        <select id="select-tipo-red" style="background: #3c3c3c; color: #ddd; border: 1px solid #555; border-radius: 3px; font-size: 9px; padding: 2px;">
                            <option value="lineal">Lineal</option>
                            <option value="anillo">Anillo</option>
                        </select>
                        <div style="display: flex; gap: 2px;">
                            <input type="number" id="input-caudal" step="10" value="0" placeholder="CFM" style="width: 40px; background: #3c3c3c; border: 1px solid #555; color: white; font-size: 9px; border-radius: 3px; padding: 2px;">
                            <select id="select-diametro-manual" style="width: 50px; background: #1e1e1e; color: #4fc3f7; border: 1px solid #4fc3f7; border-radius: 3px; font-size: 9px; padding: 2px; font-weight: bold;">
                                <option value="">Ø Auto</option>
                                <option value='3/4"'>3/4"</option>
                                <option value='1"'>1"</option>
                                <option value='1 1/2"'>1 1/2"</option>
                                <option value='2"'>2"</option>
                                <option value='2 1/2"'>2 1/2"</option>
                                <option value='3"'>3"</option>
                                <option value='4"'>4"</option>
                                <option value='6"'>6"</option>
                                <option value='8"'>8"</option>
                                <option value='10"'>10"</option>
                            </select>
                            <button id="btn-aplicar-diametro" title="Aplicar Diámetro a selección" style="background: #4fc3f7; color: #121212; border: none; border-radius: 3px; font-size: 9px; padding: 2px 4px; cursor: pointer; font-weight: bold;">OK</button>
                        </div>
                    </div>
                </div>
                <div class="ribbon-group-label">Proyecto</div>
            </div>

            <div style="margin-left: auto; display: flex; align-items: center; gap: 6px; padding-right: 8px;">
                <button class="action-btn" id="btn-load-bg">🖼️ Fondo</button>
                <button class="action-btn" id="btn-show-bom">📦 BOM</button>
                <button class="action-btn" id="btn-logout" style="color: #e57373;" title="Cerrar sesión">⏻</button>
            </div>
        </header>

        <!-- Canvas area -->
        <div id="canvas-wrapper" style="touch-action: none;">
            <canvas id="mainCanvas" oncontextmenu="return false;"></canvas>
            <input type="text" id="length-input" style="position: absolute; display: none; z-index: 100; font-size: 14px; width: 60px; text-align: center; border: 1px solid #1A4A8A; background: #0F3460; color: white; border-radius: 4px; padding: 4px;" />
            <input type="text" id="floating-dim-input" style="position: absolute; display: none; z-index: 100; font-size: 14px; width: 60px; text-align: center; border: 1px dashed #FF9800; background: #0F3460; color: #FF9800; border-radius: 4px; padding: 4px;" />
            <div id="mode-indicator" class="hidden">Modo: —</div>

            <!-- Floating Background Controls -->
            <div id="bg-controls" style="display: none; position: absolute; top: 10px; right: 10px; background: rgba(38,38,38,0.95); border: 1px solid #3c3c3c; border-radius: 6px; padding: 10px; z-index: 50; font-size: 11px; color: #bcbcbc; min-width: 180px;">
                <div style="margin-bottom: 6px; font-weight: 600; color: #e0e0e0;">🖼️ Plano de Fondo</div>
                <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">Opacidad <span id="bg-opacity-val">50%</span></label>
                <input type="range" id="bg-opacity" min="10" max="100" value="50" style="width: 100%; accent-color: #007acc;">
                <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; margin-top: 6px;">Escala <span id="bg-scale-val">1.0x</span></label>
                <input type="range" id="bg-scale" min="0.1" max="5" step="0.1" value="1" style="width: 100%; accent-color: #007acc;">
                <button id="btn-remove-bg" class="action-btn" style="width: 100%; margin-top: 8px; font-size: 10px; padding: 4px 8px; justify-content: center;">❌ Quitar Fondo</button>
            </div>

        </div>

        <!-- Command Bar -->
        <footer id="command-bar">
            <div id="command-text">
                <span class="command-prompt">COMANDO:</span>
                <span id="status-text">Iniciado. Seleccione una herramienta.</span>
            </div>
            <div id="coords-display">X: 0.00, Y: 0.00, Z: 0.00</div>
        </footer>
    </div>

    <input type="file" id="bg-input" accept="image/png, image/jpeg, image/webp, .dxf" style="display: none;" />
    <script type="module" src="js/main.js?v=8"></script>
</body>

</html>
