version: '3.8'

services:
  # ── PostgreSQL (desarrollo local idéntico a Railway) ──────────
  db:
    image: postgres:16-alpine
    container_name: draw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airpipe
      POSTGRES_PASSWORD: airpipe_dev_2024
      POSTGRES_DB: airpipe_draw
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # ── Backend + Frontend ────────────────────────────────────────
  draw_app:
    build: .
    container_name: draw_production_api
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - draw_uploads:/app/server_uploads
    environment:
      - DATABASE_URL=postgresql://airpipe:airpipe_dev_2024@db:5432/airpipe_draw
      - ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - JWT_SECRET_KEY=cambia-esta-clave-secreta-pronto
      - FLASK_ENV=production
      - PORT=5000
    depends_on:
      - db

volumes:
  pg_data:
  draw_uploads:
